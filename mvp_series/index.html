      <video

        autoplay

        loop

        preload="auto"
      ></video>
    </div>

    <header class="nav1-header nav1-header--dark">
      <nav class="nav1-bar">
        <button
          class="nav1-menu"
          type="button"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="public-nav-overlay"
          data-public-nav-toggle
        >
          <span class="menu-lines" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>

      data-public-nav-overlay

      <nav class="offerings-public-overlay-nav">
        <a href="index.html" class="overlay-link" style="--i: 0" data-nav-link>Home</a>

        <a href="contact.html" class="overlay-link" style="--i: 3" data-nav-link>Contact</a>
      </nav>
    </aside>

    <main class="home-wire-main">
      <section class="home-wire-hero">
        <h2>Begin where you are, evolve with intention.</h2>
        <a class="home-wire-cta" href="offerings.html">Become a Member</a>
      </section>
    </main>

    <footer class="home-wire-footer">
      <div class="home-wire-footer-stack">
        <div class="home-wire-footer-logo">
          <a href="index.html" aria-label="The Routine Service Home">
            <img src="assets/TRS%20Logo%20Circled.png" alt="" />
          </a>
        </div>
        <div class="home-wire-footer-legal">
          <nav class="footer-legal" aria-label="Legal">
            <a href="terms.html">Terms and conditions</a>
            <span aria-hidden="true">•</span>
